[package]
name = "yola-code-desktop"
version = "0.8.0"
description = "YolaCode Desktop — el editor nativo de YOLA como aplicación independiente"
authors = ["YOLA"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Esta feature se usa para que tauri-build genere el context en producción
custom-protocol = ["tauri/custom-protocol"]
