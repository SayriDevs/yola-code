[package]
name = "yola-code-desktop"
version = "0.8.0"
description = "YolaCode Desktop — IDE nativo de YOLA como aplicación independiente. Monaco + xterm.js + agente."
authors = ["YOLA"]
edition = "2021"

[lib]
name = "yola_code_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
